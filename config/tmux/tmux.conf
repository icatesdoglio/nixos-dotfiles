# ============================================= #
# Window/pane layout convention                 #
# --------------------------------------------- #
# Every project session follows:
#   window 0 "edit" = nvim
#   window 1 "repl" = shell / REPL
# vim-slime targets ":1.0" (no session name, so it always means "the
# repl window of whatever session I'm currently in") relies on this.
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -g mouse on
set -s escape-time 10
set -g history-limit 50000
set -g status-position top
set -g focus-events on

# Forward modifier+key distinctions (e.g. Ctrl-Enter vs Enter) from
# wezterm through to programs running inside panes, e.g. nvim.
# Without this tmux swallows the extended escape sequence and every
# nvim mapping on Ctrl-CR silently degrades to plain Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ============================================= #
# Prefix: Ctrl-Space                            #
# ============================================= #
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================= #
# Bindings                                      #
# ============================================= #
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================= #
# Theme: tokyonight (matches wezterm)           #
# ============================================= #
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"
set -g status-right "#[fg=#565f89]%Y-%m-%d #[fg=#7dcfff]%H:%M #[fg=#1a1b26,bg=#bb9af7,bold] #h "

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#9ece6a,bold] #I:#W "

set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#bb9af7,fg=#1a1b26,bold"

setw -g clock-mode-colour "#7aa2f7"
